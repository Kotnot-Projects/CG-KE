<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChickenGun Kotnot Edition 🐔</title>
    <style>
        /* ============================================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: none;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            border: 3px solid #e94560;
            border-radius: 12px;
            overflow: hidden;
            background: #16213e;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #16213e;
            touch-action: none;
        }

        /* ============================================================
           HUD (интерфейс поверх игры)
           ============================================================ */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #hud span {
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hp-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hp-fill {
            width: 80px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-fill-inner {
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #2ecc71);
            transition: width 0.3s;
            width: 100%;
        }

        /* Панель оружия */
        #weaponBar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #e94560;
            z-index: 10;
            pointer-events: none;
        }

        .weapon-slot {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid transparent;
            transition: all 0.2s;
            pointer-events: auto;
            cursor: pointer;
        }

        .weapon-slot.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.2);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }

        .weapon-slot.locked {
            opacity: 0.3;
            pointer-events: none;
        }

        /* Кнопки */
        .menu-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #e94560;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 18px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .menu-btn:active {
            transform: scale(0.9);
        }

        #menuBtn { top: 10px; right: 10px; }
        #shopBtn { bottom: 10px; left: 10px; }
        #settingsBtn { bottom: 10px; right: 10px; }

        /* ============================================================
           МОДАЛЬНЫЕ ОКНА
           ============================================================ */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(145deg, #1a1a3e, #0d0d2b);
            border: 2px solid #e94560;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            max-height: 80vh;
            overflow-y: auto;
            color: white;
            box-shadow: 0 20px 60px rgba(233, 69, 96, 0.3);
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            color: #f1c40f;
            font-size: 22px;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #e94560;
            font-size: 24px;
            cursor: pointer;
        }

        /* Меню режимов */
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .mode-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: #e94560;
        }

        .mode-card.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
        }

        .mode-card .icon {
            font-size: 32px;
            display: block;
        }

        .mode-card .name {
            font-size: 13px;
            margin-top: 6px;
            font-weight: bold;
        }

        .mode-card .desc {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Магазин */
        .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }

        .shop-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shop-item-info div {
            font-size: 13px;
        }

        .shop-item-info .name {
            font-weight: bold;
            color: #f1c40f;
        }

        .shop-item-info .price {
            color: #aaa;
            font-size: 11px;
        }

        .shop-buy-btn {
            padding: 4px 16px;
            background: #2ecc71;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .shop-buy-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .shop-buy-btn:active:not(:disabled) {
            transform: scale(0.9);
        }

        /* Скины */
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .skin-item {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skin-item.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
        }

        .skin-item .skin-name {
            font-size: 10px;
            margin-top: 4px;
            color: #aaa;
        }

        /* Настройки */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .setting-row label {
            font-size: 14px;
        }

        .setting-row input[type="range"] {
            width: 120px;
            accent-color: #e94560;
            background: transparent;
        }

        .setting-row select {
            background: #2a2a4a;
            color: white;
            border: 1px solid #e94560;
            border-radius: 6px;
            padding: 4px 8px;
        }

        .setting-row .toggle {
            width: 40px;
            height: 22px;
            background: #555;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }

        .setting-row .toggle.active {
            background: #2ecc71;
        }

        .setting-row .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .setting-row .toggle.active::after {
            left: 20px;
        }

        /* Адаптивность */
        @media (max-width: 420px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
            }
            .modal {
                max-height: 90vh;
                padding: 16px;
            }
            .setting-row input[type="range"] {
                width: 80px;
            }
        }

        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        .modal::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hp-bar">
                <span>❤️</span>
                <div class="hp-fill">
                    <div class="hp-fill-inner" id="hpFill" style="width:100%"></div>
                </div>
                <span id="hpText">100</span>
            </div>
            <span id="moneyDisplay">💰 0</span>
        </div>

        <!-- Панель оружия -->
        <div id="weaponBar">
            <div class="weapon-slot active" data-weapon="pistol">🔫</div>
            <div class="weapon-slot locked" data-weapon="ak47">AK</div>
            <div class="weapon-slot locked" data-weapon="m16">M16</div>
            <div class="weapon-slot locked" data-weapon="rpg">💥</div>
            <div class="weapon-slot locked" data-weapon="awp">🎯</div>
        </div>

        <!-- Кнопки -->
        <button class="menu-btn" id="menuBtn">☰</button>
        <button class="menu-btn" id="shopBtn">🏪</button>
        <button class="menu-btn" id="settingsBtn">⚙️</button>

        <!-- ==================== МЕНЮ РЕЖИМОВ ==================== -->
        <div class="modal-overlay" id="menuModal">
            <div class="modal">
                <button class="modal-close" onclick="closeModal('menuModal')">✕</button>
                <h2>🐔 Выбери режим</h2>
                <div class="mode-grid" id="modeGrid">
                    <!-- Заполняется из JS -->
                </div>
                <div style="text-align:center;font-size:12px;color:#666;margin-top:10px;">
                    Текущий: <span id="menuModeDisplay" style="color:#f1c40f;">Противники</span>
                </div>
            </div>
        </div>

        <!-- ==================== МАГАЗИН ==================== -->
        <div class="modal-overlay" id="shopModal">
            <div class="modal">
                <button class="modal-close" onclick="closeModal('shopModal')">✕</button>
                <h2>🏪 Магазин</h2>
                <div style="text-align:center;color:#f1c40f;margin-bottom:12px;">
                    💰 <span id="shopMoney">0</span> ZWD
                </div>
                
                <h3 style="font-size:14px;color:#aaa;margin:10px 0 6px;">🔫 Оружие</h3>
                <div id="weaponShop"></div>
                
                <h3 style="font-size:14px;color:#aaa;margin:10px 0 6px;">🎨 Скины</h3>
                <div class="skin-grid" id="skinShop"></div>
            </div>
        </div>

        <!-- ==================== НАСТРОЙКИ ==================== -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal">
                <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
                <h2>⚙️ Настройки</h2>
                
                <div class="setting-row">
                    <label>🌐 Язык</label>
                    <select id="languageSelect">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                    </select>
                </div>
                
                <div class="setting-row">
                    <label>🎮 Чувствительность</label>
                    <input type="range" min="1" max="10" value="5" id="sensitivitySlider">
                </div>
                
                <div class="setting-row">
                    <label>🖼️ Графика</label>
                    <select id="graphicsSelect">
                        <option value="high">Высокая</option>
                        <option value="medium" selected>Средняя</option>
                        <option value="low">Низкая</option>
                    </select>
                </div>
                
                <div style="text-align:center;margin-top:16px;font-size:12px;color:#666;">
                    ChickenGun Kotnot Edition v3.0
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ПОЛУЧЕНИЕ ДОСТУПА К ЭЛЕМЕНТАМ
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hpFill = document.getElementById('hpFill');
        const hpText = document.getElementById('hpText');
        const moneyDisplay = document.getElementById('moneyDisplay');
        const shopMoney = document.getElementById('shopMoney');

        // ============================================================
        // 2. ТЕКСТУРЫ (заглушки)
        // ============================================================
        const textures = {
            chicken: null,
            bum: null,
            pig: null,
            stepfather: null,
            monkey: null,
            ak47: null,
            m16: null,
            rpg: null,
            awp: null
        };

        function loadTextures() {
            const textureMap = {
                chicken: '1.png',
                bum: '2.png',
                pig: '3.png',
                stepfather: '4.png',
                monkey: '5.png',
                ak47: 'ak.png',
                m16: 'm.png',
                rpg: 'rpg.png',
                awp: 'awp.png'
            };
            Object.keys(textureMap).forEach(key => {
                const img = new Image();
                img.src = textureMap[key];
                textures[key] = img;
                img.onerror = () => console.warn(`Не удалось загрузить ${textureMap[key]}`);
            });
        }
        loadTextures();

        // ============================================================
        // 3. ИГРОВЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        const player = {
            x: 185,
            y: 520,
            w: 30,
            h: 30,
            hp: 100,
            maxHp: 100,
            speed: 5
        };

        const weapons = {
            pistol: { name: 'Пистолет', damage: 15, fireRate: 10, speed: 8, icon: '🔫', price: 0 },
            ak47: { name: 'AK-47', damage: 25, fireRate: 4, speed: 10, icon: '🔫', price: 5000 },
            m16: { name: 'M16', damage: 20, fireRate: 3, speed: 12, icon: '🔫', price: 8000 },
            rpg: { name: 'RPG', damage: 80, fireRate: 30, speed: 5, icon: '💥', price: 15000 },
            awp: { name: 'AWP', damage: 50, fireRate: 20, speed: 15, icon: '🎯', price: 12000 }
        };

        const skins = [
            { id: 'default', name: 'Обычная', price: 0, emoji: '🐔' },
            { id: 'golden', name: 'Золотая', price: 10000, emoji: '🐓' },
            { id: 'cyber', name: 'Кибер', price: 25000, emoji: '🤖' },
            { id: 'demon', name: 'Демон', price: 50000, emoji: '👿' },
            { id: 'rainbow', name: 'Радуга', price: 75000, emoji: '🌈' }
        ];

        // ============================================================
        // 4. РЕЖИМЫ ИГРЫ (КЛАССЫ)
        // ============================================================
        
        /**
         * Базовый класс режима
         * Каждый режим наследует его и переопределяет методы
         */
        class GameMode {
            constructor() {
                this.name = 'Базовый';
                this.icon = '🎮';
                this.description = 'Описание режима';
                this.enemies = [];
                this.pickups = [];
                this.capturePoints = [];
                this.particles = [];
                this.bullets = [];
                this.score = 0;
                this.frameCount = 0;
                this.gameOver = false;
            }

            // Обновление логики режима
            update(player, weapons, currentWeapon) {
                this.frameCount++;
                // Обновляем пули
                this.bullets.forEach(b => b.y -= b.speed);
                this.bullets = this.bullets.filter(b => b.y > -50);

                // Обновляем частицы
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.life--;
                });
                this.particles = this.particles.filter(p => p.life > 0);
            }

            // Отрисовка режима
            draw(ctx) {
                // Рисуем частицы
                this.particles.forEach(p => {
                    const alpha = p.life / p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                });
                ctx.globalAlpha = 1;
            }

            // Создание частиц
            createParticles(x, y, color, count = 10) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6 - 2,
                        life: 20 + Math.random() * 20,
                        maxLife: 40,
                        size: 2 + Math.random() * 4,
                        color: color
                    });
                }
            }

            // Получение счёта
            getScore() {
                return this.score;
            }

            // Проверка Game Over
            isGameOver() {
                return this.gameOver;
            }
        }

        // ============================================================
        // РЕЖИМ 1: ПРОТИВНИКИ (классическая стрельба)
        // ============================================================
        class VersusMode extends GameMode {
            constructor() {
                super();
                this.name = 'Противники';
                this.icon = '👊';
                this.description = 'Уничтожай врагов и зарабатывай деньги';
                this.spawnTimer = 0;
            }

            update(player, weapons, currentWeapon) {
                super.update(player, weapons, currentWeapon);
                
                // Спавн врагов
                this.spawnTimer++;
                if (this.spawnTimer > 60) {
                    this.spawnTimer = 0;
                    if (Math.random() < 0.4) {
                        this.spawnEnemy();
                    }
                }

                // Движение врагов
                this.enemies.forEach(e => e.y += e.speed);
                this.enemies = this.enemies.filter(e => e.y < 650);

                // Столкновения пуль с врагами
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const b = this.bullets[i];
                        const e = this.enemies[j];
                        
                        if (b.x < e.x + e.w && b.x + b.w > e.x &&
                            b.y < e.y + e.h && b.y + b.h > e.y) {
                            e.hp -= b.damage;
                            this.bullets.splice(i, 1);
                            this.createParticles(b.x, b.y, '#ff4444', 8);
                            
                            if (e.hp <= 0) {
                                this.enemies.splice(j, 1);
                                this.score += 10;
                                this.createParticles(e.x + e.w/2, e.y + e.h/2, '#ffdd00', 20);
                                return 20 + Math.floor(Math.random() * 30); // деньги
                            }
                            break;
                        }
                    }
                }

                // Проверка Game Over
                this.enemies.forEach(e => {
                    if (e.y + e.h > player.y + 10 && 
                        e.x < player.x + player.w && e.x + e.w > player.x) {
                        player.hp -= 1;
                    }
                });

                return 0;
            }

            spawnEnemy() {
                const types = ['bum', 'pig', 'monkey'];
                const type = types[Math.floor(Math.random() * types.length)];
                const hp = type === 'pig' ? 40 : type === 'monkey' ? 25 : 30;
                
                this.enemies.push({
                    x: Math.random() * (400 - 30),
                    y: -30,
                    w: 28,
                    h: 28,
                    hp: hp,
                    maxHp: hp,
                    speed: 0.5 + Math.random() * 1.5,
                    type: type,
                    texture: textures[type]
                });
            }

            draw(ctx) {
                super.draw(ctx);
                
                // Рисуем врагов
                this.enemies.forEach(e => {
                    if (e.texture && e.texture.complete && e.texture.naturalWidth) {
                        ctx.drawImage(e.texture, e.x, e.y, e.w, e.h);
                    } else {
                        const colors = { bum: '#8e44ad', pig: '#27ae60', monkey: '#d35400' };
                        ctx.fillStyle = colors[e.type] || '#666';
                        ctx.fillRect(e.x, e.y, e.w, e.h);
                        const emojis = { bum: '🧟', pig: '🐷', monkey: '🐒' };
                        ctx.fillStyle = 'white';
                        ctx.font = '18px sans-serif';
                        ctx.fillText(emojis[e.type] || '❓', e.x + 4, e.y + 22);
                    }
                    
                    const hpPercent = e.hp / e.maxHp;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(e.x, e.y - 8, e.w, 4);
                    ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f1c40f' : '#e74c3c';
                    ctx.fillRect(e.x, e.y - 8, e.w * hpPercent, 4);
                });
            }
        }

        // ============================================================
        // РЕЖИМ 2: ОБОССАТЬ ХОЛОДОС (замороженные враги + лед)
        // ============================================================
        class ColdMode extends GameMode {
            constructor() {
                super();
                this.name = 'Обоссать холодос';
                this.icon = '❄️';
                this.description = 'Заморозь врагов и разбей их!';
                this.spawnTimer = 0;
                this.freezeChance = 0.7;
            }

            update(player, weapons, currentWeapon) {
                super.update(player, weapons, currentWeapon);
                
                this.spawnTimer++;
                if (this.spawnTimer > 80) {
                    this.spawnTimer = 0;
                    if (Math.random() < 0.3) {
                        this.spawnEnemy();
                    }
                }

                // Враги медленные (замороженные)
                this.enemies.forEach(e => {
                    e.y += e.speed * 0.3;
                    // Эффект льда
                    if (Math.random() < 0.02) {
                        this.createParticles(e.x + e.w/2, e.y + e.h/2, '#88ddff', 2);
                    }
                });
                this.enemies = this.enemies.filter(e => e.y < 650);

                // Столкновения
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const b = this.bullets[i];
                        const e = this.enemies[j];
                        
                        if (b.x < e.x + e.w && b.x + b.w > e.x &&
                            b.y < e.y + e.h && b.y + b.h > e.y) {
                            
                            // Замороженные враги получают двойной урон
                            const damage = b.damage * 2;
                            e.hp -= damage;
                            this.bullets.splice(i, 1);
                            this.createParticles(b.x, b.y, '#88ddff', 12);
                            
                            if (e.hp <= 0) {
                                this.enemies.splice(j, 1);
                                this.score += 15;
                                this.createParticles(e.x + e.w/2, e.y + e.h/2, '#ffffff', 30);
                                return 30 + Math.floor(Math.random() * 40);
                            }
                            break;
                        }
                    }
                }

                return 0;
            }

            spawnEnemy() {
                const types = ['bum', 'pig'];
                const type = types[Math.floor(Math.random() * types.length)];
                this.enemies.push({
                    x: Math.random() * (400 - 30),
                    y: -30,
                    w: 28,
                    h: 28,
                    hp: 25,
                    maxHp: 25,
                    speed: 0.3 + Math.random() * 0.8,
                    type: type,
                    texture: textures[type]
                });
            }

            draw(ctx) {
                super.draw(ctx);
                
                // Ледяной фон
                ctx.fillStyle = 'rgba(100, 200, 255, 0.05)';
                ctx.fillRect(0, 0, 400, 600);
                
                // Снежинки
                for (let i = 0; i < 20; i++) {
                    const x = (i * 23 + this.frameCount * 0.1) % 400;
                    const y = (i * 17 + this.frameCount * 0.3) % 600;
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(x, y, 1 + Math.sin(i) * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                this.enemies.forEach(e => {
                    if (e.texture && e.texture.complete && e.texture.naturalWidth) {
                        ctx.drawImage(e.texture, e.x, e.y, e.w, e.h);
                    } else {
                        ctx.fillStyle = '#4a90d9';
                        ctx.fillRect(e.x, e.y, e.w, e.h);
                        ctx.fillStyle = 'white';
                        ctx.font = '18px sans-serif';
                        ctx.fillText('🧊', e.x + 4, e.y + 22);
                    }
                    
                    // Ледяная обводка
                    ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(e.x - 2, e.y - 2, e.w + 4, e.h + 4);
                    
                    const hpPercent = e.hp / e.maxHp;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(e.x, e.y - 8, e.w, 4);
                    ctx.fillStyle = '#88ddff';
                    ctx.fillRect(e.x, e.y - 8, e.w * hpPercent, 4);
                });
            }
        }

        // ============================================================
        // РЕЖИМ 3: ГРАБЕЖ КОРОВАНОВ (собирай предметы)
        // ============================================================
        class RobberyMode extends GameMode {
            constructor() {
                super();
                this.name = 'Грабеж Корованов';
                this.icon = '💰';
                this.description = 'Собирай падающие ценности!';
                this.spawnTimer = 0;
                this.collected = 0;
            }

            update(player, weapons, currentWeapon) {
                super.update(player, weapons, currentWeapon);
                
                this.spawnTimer++;
                if (this.spawnTimer > 40) {
                    this.spawnTimer = 0;
                    if (Math.random() < 0.3) {
                        this.spawnPickup();
                    }
                }

                // Движение предметов
                this.pickups.forEach(p => p.y += 1.5);
                this.pickups = this.pickups.filter(p => p.y < 650);

                // Сбор предметов игроком
                for (let i = this.pickups.length - 1; i >= 0; i--) {
                    const p = this.pickups[i];
                    if (p.x < player.x + player.w && p.x + p.w > player.x &&
                        p.y < player.y + player.h && p.y + p.h > player.y) {
                        
                        const value = p.value;
                        this.pickups.splice(i, 1);
                        this.collected++;
                        this.createParticles(p.x + p.w/2, p.y + p.h/2, '#f1c40f', 15);
                        return value;
                    }
                }

                return 0;
            }

            spawnPickup() {
                const types = ['money', 'money', 'money', 'health', 'super'];
                const type = types[Math.floor(Math.random() * types.length)];
                const values = { money: 50, health: 30, super: 150 };
                
                this.pickups.push({
                    x: Math.random() * (400 - 30),
                    y: -30,
                    w: 25,
                    h: 25,
                    value: values[type] || 50,
                    type: type,
                    emoji: type === 'money' ? '💰' : type === 'health' ? '❤️' : '⭐'
                });
            }

            draw(ctx) {
                super.draw(ctx);
                
                // Счётчик собранного
                ctx.fillStyle = 'white';
                ctx.font = '12px monospace';
                ctx.fillText(`📦 Собрано: ${this.collected}`, 10, 560);
                
                this.pickups.forEach(p => {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = p.type === 'super' ? '#ffdd00' : 
                                    p.type === 'money' ? '#f1c40f' : '#2ecc71';
                    ctx.fillStyle = p.type === 'super' ? '#ffdd00' : 
                                   p.type === 'money' ? '#f1c40f' : '#2ecc71';
                    ctx.beginPath();
                    ctx.arc(p.x + p.w/2, p.y + p.h/2, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // Эмодзи
                    ctx.font = '18px sans-serif';
                    ctx.fillText(p.emoji, p.x + 2, p.y + 20);
                    
                    // Свечение для супер-предметов
                    if (p.type === 'super') {
                        ctx.strokeStyle = 'rgba(255, 220, 0, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(p.x + p.w/2, p.y + p.h/2, 18, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                });
            }
        }

        // ============================================================
        // РЕЖИМ 4: НАГИБАТЬ ДВОРЦА (захват точек)
        // ============================================================
        class PalaceMode extends GameMode {
            constructor() {
                super();
                this.name = 'Нагибать дворца';
                this.icon = '🏰';
                this.description = 'Захватывай все точки!';
                this.capturedCount = 0;
                this.spawnTimer = 0;
                this.initPoints();
            }

            initPoints() {
                this.capturePoints = [];
                const positions = [
                    { x: 50, y: 150 },
                    { x: 200, y: 80 },
                    { x: 350, y: 150 },
                    { x: 80, y: 300 },
                    { x: 320, y: 300 }
                ];
                positions.forEach((pos, i) => {
                    this.capturePoints.push({
                        x: pos.x,
                        y: pos.y,
                        w: 40,
                        h: 40,
                        captured: false,
                        progress: 0,
                        index: i
                    });
                });
            }

            update(player, weapons, currentWeapon) {
                super.update(player, weapons, currentWeapon);
                
                // Враги мешают захвату
                this.spawnTimer++;
                if (this.spawnTimer > 100) {
                    this.spawnTimer = 0;
                    if (Math.random() < 0.2) {
                        this.spawnEnemy();
                    }
                }

                this.enemies.forEach(e => e.y += e.speed);
                this.enemies = this.enemies.filter(e => e.y < 650);

                // Обновление точек захвата
                let allCaptured = true;
                this.capturePoints.forEach(point => {
                    if (point.captured) return;
                    allCaptured = false;
                    
                    const onPoint = player.x + player.w > point.x &&
                                   player.x < point.x + point.w &&
                                   player.y + player.h > point.y &&
                                   player.y < point.y + point.h;
                    
                    if (onPoint) {
                        point.progress += 1.5;
                        this.createParticles(point.x + point.w/2, point.y + point.h/2, '#00ff88', 1);
                        if (point.progress >= 100) {
                            point.captured = true;
                            this.capturedCount++;
                            this.createParticles(point.x + point.w/2, point.y + point.h/2, '#00ff00', 30);
                            return 300;
                        }
                    } else if (point.progress > 0) {
                        point.progress -= 0.5;
                    }
                });

                // Проверка победы
                if (allCaptured && this.capturePoints.length > 0) {
                    this.gameOver = true;
                }

                // Столкновения пуль с врагами
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const b = this.bullets[i];
                        const e = this.enemies[j];
                        
                        if (b.x < e.x + e.w && b.x + b.w > e.x &&
                            b.y < e.y + e.h && b.y + b.h > e.y) {
                            e.hp -= b.damage;
                            this.bullets.splice(i, 1);
                            this.createParticles(b.x, b.y, '#ff4444', 8);
                            
                            if (e.hp <= 0) {
                                this.enemies.splice(j, 1);
                                this.score += 10;
                                this.createParticles(e.x + e.w/2, e.y + e.h/2, '#ffdd00', 20);
                                return 15 + Math.floor(Math.random() * 20);
                            }
                            break;
                        }
                    }
                }

                return 0;
            }

            spawnEnemy() {
                this.enemies.push({
                    x: Math.random() * (400 - 30),
                    y: -30,
                    w: 25,
                    h: 25,
                    hp: 20,
                    maxHp: 20,
                    speed: 0.5 + Math.random(),
                    type: 'bum',
                    texture: textures.bum
                });
            }

            draw(ctx) {
                super.draw(ctx);
                
                // Рисуем точки захвата
                this.capturePoints.forEach(point => {
                    const progress = point.progress / 100;
                    const color = point.captured ? '#2ecc71' : 
                                 progress > 0 ? '#f1c40f' : '#e74c3c';
                    
                    // Прозрачный фон
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(point.x, point.y, point.w, point.h);
                    
                    // Рамка
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(point.x, point.y, point.w, point.h);
                    
                    // Прогресс захвата
                    if (!point.captured) {
                        ctx.fillStyle = 'rgba(241, 196, 15, 0.3)';
                        ctx.fillRect(point.x, point.y + point.h - 4, point.w * progress, 4);
                    }
                    
                    // Иконка
                    ctx.font = '20px sans-serif';
                    ctx.fillStyle = color;
                    if (point.captured) {
                        ctx.fillText('🏁', point.x + 10, point.y + 28);
                    } else {
                        ctx.fillText('⚡', point.x + 12, point.y + 28);
                    }
                    
                    // Номер точки
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '9px monospace';
                    ctx.fillText(`#${point.index + 1}`, point.x + 14, point.y + 8);
                });

                // Счётчик захваченных точек
                ctx.fillStyle = 'white';
                ctx.font = '12px monospace';
                ctx.fillText(`🏰 ${this.capturedCount}/${this.capturePoints.length}`, 10, 560);

                // Рисуем врагов
                this.enemies.forEach(e => {
                    if (e.texture && e.texture.complete && e.texture.naturalWidth) {
                        ctx.drawImage(e.texture, e.x, e.y, e.w, e.h);
                    } else {
                        ctx.fillStyle = '#8e44ad';
                        ctx.fillRect(e.x, e.y, e.w, e.h);
                        ctx.fillStyle = 'white';
                        ctx.font = '16px sans-serif';
                        ctx.fillText('🧟', e.x + 4, e.y + 20);
                    }
                    const hpPercent = e.hp / e.maxHp;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(e.x, e.y - 8, e.w, 4);
                    ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : hpPercent > 0.25 ? '#f1c40f' : '#e74c3c';
                    ctx.fillRect(e.x, e.y - 8, e.w * hpPercent, 4);
                });

                // Сообщение о победе
                if (this.gameOver) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, 400, 600);
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 36px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏆 ПОБЕДА!', 200, 280);
                    ctx.fillStyle = 'white';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('Все точки захвачены!', 200, 320);
                    ctx.textAlign = 'left';
                }
            }
        }

        // ============================================================
        // 5. УПРАВЛЕНИЕ РЕЖИМАМИ
        // ============================================================
        let currentMode = null;
        let availableModes = [
            new VersusMode(),
            new ColdMode(),
            new RobberyMode(),
            new PalaceMode()
        ];

        // Переменные для игры
        let currentWeapon = 'pistol';
        let fireCooldown = 0;
        let ownedWeapons = ['pistol'];
        let ownedSkins = ['default'];
        let currentSkin = 'default';
        let money = 0;
        let score = 0;
        let globalGameOver = false;
        let frameCount = 0;
        let bullets = [];
        let particles = [];

        const settings = {
            language: 'ru',
            sensitivity: 5,
            graphics: 'medium'
        };

        // ============================================================
        // 6. ФУНКЦИИ МАГАЗИНА
        // ============================================================
        function buyItem(type, id) {
            let item, price;
            
            if (type === 'weapon') {
                item = weapons[id];
                price = item.price;
                if (ownedWeapons.includes(id)) {
                    showMessage('Уже куплено!');
                    return;
                }
            } else if (type === 'skin') {
                item = skins.find(s => s.id === id);
                price = item.price;
                if (ownedSkins.includes(id)) {
                    showMessage('Уже куплено!');
                    return;
                }
            }

            if (money < price) {
                showMessage('Недостаточно денег! 💰');
                return;
            }

            money -= price;
            updateMoney();
            
            if (type === 'weapon') {
                ownedWeapons.push(id);
                showMessage(`Куплено: ${item.name}!`);
            } else if (type === 'skin') {
                ownedSkins.push(id);
                currentSkin = id;
                showMessage(`Скин ${item.name} активирован!`);
            }

            renderShop();
            updateWeaponBar();
        }

        function updateMoney() {
            moneyDisplay.textContent = `💰 ${money}`;
            shopMoney.textContent = money;
        }

        function showMessage(text) {
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.9);
                color: #f1c40f;
                padding: 16px 32px;
                border-radius: 12px;
                border: 2px solid #e94560;
                font-family: monospace;
                font-size: 18px;
                z-index: 200;
                pointer-events: none;
                animation: fadeOut 1.5s forwards;
            `;
            document.getElementById('gameContainer').appendChild(msg);
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeOut {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                }
            `;
            document.head.appendChild(style);
            
            setTimeout(() => {
                msg.remove();
                style.remove();
            }, 1500);
        }

        // ============================================================
        // 7. РЕНДЕРИНГ МАГАЗИНА
        // ============================================================
        function renderShop() {
            const weaponShop = document.getElementById('weaponShop');
            weaponShop.innerHTML = '';
            
            Object.keys(weapons).forEach(key => {
                const w = weapons[key];
                const owned = ownedWeapons.includes(key);
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="shop-item-info">
                        <span style="font-size:24px;">${w.icon}</span>
                        <div>
                            <div class="name">${w.name}</div>
                            <div class="price">${owned ? '✅ Куплено' : `💰 ${w.price} ZWD`}</div>
                            <div style="font-size:10px;color:#666;">Урон: ${w.damage}</div>
                        </div>
                    </div>
                    <button class="shop-buy-btn" ${owned ? 'disabled' : ''} onclick="buyItem('weapon','${key}')">
                        ${owned ? '✅' : 'Купить'}
                    </button>
                `;
                weaponShop.appendChild(div);
            });

            const skinShop = document.getElementById('skinShop');
            skinShop.innerHTML = '';
            
            skins.forEach(skin => {
                const owned = ownedSkins.includes(skin.id);
                const active = currentSkin === skin.id;
                const div = document.createElement('div');
                div.className = `skin-item ${active ? 'active' : ''}`;
                div.innerHTML = `
                    <div style="font-size:32px;">${skin.emoji}</div>
                    <div class="skin-name">${skin.name}</div>
                    <div style="font-size:10px;color:#666;">
                        ${owned ? (active ? '✅ Активен' : '✅ Куплен') : `💰 ${skin.price} ZWD`}
                    </div>
                `;
                div.onclick = () => {
                    if (owned) {
                        currentSkin = skin.id;
                        renderShop();
                        showMessage(`Скин ${skin.name} активирован!`);
                    } else {
                        buyItem('skin', skin.id);
                    }
                };
                skinShop.appendChild(div);
            });

            updateMoney();
        }

        // ============================================================
        // 8. ОБНОВЛЕНИЕ ПАНЕЛИ ОРУЖИЯ
        // ============================================================
        function updateWeaponBar() {
            const slots = document.querySelectorAll('.weapon-slot');
            slots.forEach(slot => {
                const weapon = slot.dataset.weapon;
                slot.classList.toggle('active', weapon === currentWeapon);
                if (weapon !== 'pistol' && !ownedWeapons.includes(weapon)) {
                    slot.classList.add('locked');
                } else {
                    slot.classList.remove('locked');
                }
            });
        }

        document.querySelectorAll('.weapon-slot').forEach(slot => {
            slot.addEventListener('click', () => {
                const weapon = slot.dataset.weapon;
                if (weapon === 'pistol' || ownedWeapons.includes(weapon)) {
                    currentWeapon = weapon;
                    updateWeaponBar();
                }
            });
        });

        // ============================================================
        // 9. МЕНЮ РЕЖИМОВ
        // ============================================================
        function renderModeMenu() {
            const grid = document.getElementById('modeGrid');
            grid.innerHTML = '';
            
            availableModes.forEach((mode, index) => {
                const div = document.createElement('div');
                div.className = `mode-card ${currentMode === mode ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="icon">${mode.icon}</span>
                    <div class="name">${mode.name}</div>
                    <div class="desc">${mode.description}</div>
                `;
                div.onclick = () => setMode(index);
                grid.appendChild(div);
            });
        }

        function setMode(index) {
            currentMode = availableModes[index];
            document.getElementById('menuModeDisplay').textContent = currentMode.name;
            
            // Сброс состояния
            bullets = [];
            particles = [];
            globalGameOver = false;
            player.hp = player.maxHp;
            
            // Очищаем старые объекты режима
            if (currentMode) {
                currentMode.enemies = [];
                currentMode.pickups = [];
                currentMode.particles = [];
                currentMode.bullets = [];
                currentMode.score = 0;
                currentMode.gameOver = false;
                if (currentMode.initPoints) {
                    currentMode.initPoints();
                }
            }
            
            closeModal('menuModal');
            renderModeMenu();
            showMessage(`Режим: ${currentMode.name}`);
        }

        // ============================================================
        // 10. МОДАЛЬНЫЕ ОКНА
        // ============================================================
        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if (id === 'shopModal') renderShop();
            if (id === 'settingsModal') loadSettings();
            if (id === 'menuModal') renderModeMenu();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('menuBtn').addEventListener('click', () => openModal('menuModal'));
        document.getElementById('shopBtn').addEventListener('click', () => openModal('shopModal'));
        document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal'));

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        });

        // ============================================================
        // 11. НАСТРОЙКИ
        // ============================================================
        function loadSettings() {
            document.getElementById('languageSelect').value = settings.language;
            document.getElementById('graphicsSelect').value = settings.graphics;
            document.getElementById('sensitivitySlider').value = settings.sensitivity;
        }

        document.getElementById('languageSelect').addEventListener('change', (e) => {
            settings.language = e.target.value;
        });

        document.getElementById('graphicsSelect').addEventListener('change', (e) => {
            settings.graphics = e.target.value;
        });

        document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
            settings.sensitivity = parseInt(e.target.value);
        });

        // ============================================================
        // 12. УПРАВЛЕНИЕ ИГРОКОМ
        // ============================================================
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            const canvasX = (clientX - rect.left) * (400 / rect.width);
            const sens = settings.sensitivity / 5;
            const targetX = Math.max(0, Math.min(400 - player.w, canvasX - player.w / 2));
            player.x += (targetX - player.x) * 0.3 * sens;
        }

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons > 0) handleMove(e.clientX);
        });

        canvas.addEventListener('mousedown', (e) => {
            handleMove(e.clientX);
            shoot();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleMove(touch.clientX);
            shoot();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleMove(touch.clientX);
        }, { passive: false });

        // ============================================================
        // 13. СТРЕЛЬБА
        // ============================================================
        function shoot() {
            if (globalGameOver || !currentMode) return;
            if (fireCooldown > 0) return;
            
            const weapon = weapons[currentWeapon];
            fireCooldown = weapon.fireRate;
            
            // Создаём пулю
            const bullet = {
                x: player.x + player.w / 2 - 3,
                y: player.y - 10,
                w: 6,
                h: 16,
                speed: weapon.speed,
                damage: weapon.damage,
                isRPG: currentWeapon === 'rpg'
            };
            
            // Добавляем в текущий режим
            if (currentMode) {
                currentMode.bullets.push(bullet);
                currentMode.createParticles(player.x + player.w/2, player.y, '#f1c40f', 5);
            }
        }

        // ============================================================
        // 14. ОБНОВЛЕНИЕ ИГРЫ
        // ============================================================
        function update() {
            if (globalGameOver || !currentMode) return;
            
            frameCount++;
            if (fireCooldown > 0) fireCooldown--;
            
            // Обновляем текущий режим
            const earned = currentMode.update(player, weapons, currentWeapon);
            if (earned > 0) {
                money += earned;
                updateMoney();
            }
            
            // Проверка Game Over
            if (currentMode.isGameOver()) {
                globalGameOver = true;
                showMessage('🏆 Режим пройден!');
            }
            
            // Проверка смерти игрока
            if (player.hp <= 0) {
                globalGameOver = true;
                showMessage('💀 ИГРА ОКОНЧЕНА!');
            }
        }

        // ============================================================
        // 15. ОТРИСОВКА
        // ============================================================
        function draw() {
            ctx.clearRect(0, 0, 400, 600);
            
            // Фон
            const gradient = ctx.createLinearGradient(0, 0, 0, 600);
            gradient.addColorStop(0, '#16213e');
            gradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 400, 600);
            
            // Рисуем текущий режим
            if (currentMode) {
                currentMode.draw(ctx);
            }
            
            // Рисуем пули (если они не в режиме)
            // Пули уже рисуются в режиме
            
            // Рисуем игрока (курица со скином)
            const skin = skins.find(s => s.id === currentSkin);
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f1c40f';
            ctx.fillStyle = '#f5c842';
            ctx.fillRect(player.x, player.y, player.w, player.h);
            
            // Эффекты скинов
            if (currentSkin === 'golden') {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.fillRect(player.x, player.y, player.w, player.h);
            } else if (currentSkin === 'cyber') {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 1;
                ctx.strokeRect(player.x, player.y, player.w, player.h);
            } else if (currentSkin === 'demon') {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
                ctx.fillRect(player.x, player.y, player.w, player.h);
            }
            
            ctx.shadowBlur = 0;
            ctx.font = '24px sans-serif';
            ctx.fillText(skin ? skin.emoji : '🐔', player.x + 2, player.y + 24);
            
            // Интерфейс
            ctx.fillStyle = 'white';
            ctx.font = '12px monospace';
            if (currentMode) {
                ctx.fillText(`📊 ${currentMode.getScore()}`, 150, 580);
            }
            ctx.fillText(`🔫 ${weapons[currentWeapon].name}`, 10, 580);
            
            // Обновляем HUD
            const hpPercent = player.hp / player.maxHp * 100;
            hpFill.style.width = hpPercent + '%';
            hpText.textContent = Math.floor(player.hp);
            
            // Game Over
            if (globalGameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, 400, 600);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('💀 GAME OVER', 200, 280);
                ctx.fillStyle = 'white';
                ctx.font = '20px sans-serif';
                ctx.fillText('Нажмите для рестарта', 200, 330);
                ctx.textAlign = 'left';
            }
        }

        // ============================================================
        // 16. ИГРОВОЙ ЦИКЛ
        // ============================================================
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // 17. РЕСТАРТ
        // ============================================================
        canvas.addEventListener('click', () => {
            if (globalGameOver) {
                player.hp = player.maxHp;
                globalGameOver = false;
                money = 0;
                updateMoney();
                if (currentMode) {
                    currentMode.enemies = [];
                    currentMode.pickups = [];
                    currentMode.particles = [];
                    currentMode.bullets = [];
                    currentMode.score = 0;
                    currentMode.gameOver = false;
                    if (currentMode.initPoints) {
                        currentMode.initPoints();
                    }
                }
                showMessage('🔄 Новая игра!');
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (globalGameOver) {
                e.preventDefault();
                player.hp = player.maxHp;
                globalGameOver = false;
                money = 0;
                updateMoney();
                if (currentMode) {
                    currentMode.enemies = [];
                    currentMode.pickups = [];
                    currentMode.particles = [];
                    currentMode.bullets = [];
                    currentMode.score = 0;
                    currentMode.gameOver = false;
                    if (currentMode.initPoints) {
                        currentMode.initPoints();
                    }
                }
                showMessage('🔄 Новая игра!');
            }
        }, { passive: false });

        // ============================================================
        // 18. ЗАПУСК
        // ============================================================
        window.buyItem = buyItem;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.setMode = setMode;

        // Устанавливаем режим по умолчанию
        currentMode = availableModes[0];
        renderModeMenu();
        updateMoney();
        updateWeaponBar();
        renderShop();

        // Запускаем игровой цикл
        gameLoop();

        console.log('🐔 ChickenGun Kotnot Edition v3.0 загружена!');
        console.log('📖 Доступно 4 уникальных режима:');
        console.log('   👊 Противники - классическая стрельба по врагам');
        console.log('   ❄️ Обоссать холодос - замороженные враги, двойной урон');
        console.log('   💰 Грабеж Корованов - собирай падающие ценности');
        console.log('   🏰 Нагибать дворца - захватывай 5 точек на карте');
        console.log('💰 Валюта: Зимбабвийский Доллар (ZWD)');
    </script>
</body>
